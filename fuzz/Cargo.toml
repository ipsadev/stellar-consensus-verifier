[package]
name = "stellar-consensus-verifier-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.stellar-consensus-verifier]
path = ".."

[[bin]]
name = "ledger_header_decode"
path = "fuzz_targets/ledger_header_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "envelope_decode"
path = "fuzz_targets/envelope_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "quorum_set_decode"
path = "fuzz_targets/quorum_set_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tx_set_reader"
path = "fuzz_targets/tx_set_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_update"
path = "fuzz_targets/verify_update.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

[workspace]
